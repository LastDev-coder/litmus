[project]
name = "litmus-cli"
version = "0.3.0"
description = "AI provenance inspector and quality-preserving transformation system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Atanu" }]
keywords = ["provenance", "watermark", "c2pa", "unicode", "ai-detection"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing",
    "Environment :: Console",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
# Optional. Absent by default so the base install has no network-capable
# dependency and proprietary source stays local.
c2pa = ["c2pa-python>=0.5"]
# Multi-language structural code validation (JS/TS/Java/Kotlin/Swift). Python
# is validated with the stdlib and needs nothing here.
code = ["tree-sitter>=0.23", "tree-sitter-language-pack>=0.9"]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.9",
]

[project.urls]
Homepage = "https://github.com/LastDev-coder/litmus"
Repository = "https://github.com/LastDev-coder/litmus"
Issues = "https://github.com/LastDev-coder/litmus/issues"

[project.scripts]
litmus = "litmus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litmus"]

[tool.hatch.build.targets.sdist]
# Explicit allowlist: local working files (CLAUDE.md, docs/, CHANGELOG.md, ...)
# exist in this tree but are not part of the published project. Hatchling does
# not honor .git/info/exclude, so only these paths ship in the sdist.
only-include = ["src/litmus", "tests", "README.md", "LICENSE", "SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["litmus"]

[[tool.mypy.overrides]]
# Optional dependencies with no type stubs. Listed here so the type check is
# clean whether or not the extra happens to be installed.
module = ["tree_sitter_language_pack.*", "tree_sitter.*", "c2pa.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer's declarative API requires calls in argument defaults.
"src/litmus/cli.py" = ["B008"]
# This module embeds the web UI's HTML/CSS/JS template as a string literal;
# wrapping those lines to 100 columns would harm the markup's readability.
"src/litmus/web_ui.py" = ["E501"]
